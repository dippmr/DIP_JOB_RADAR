# Fix for GitHub Actions #141 — V3 workflow mismatch

## Confirmed problem
The GitHub log shows 137 tests passing and three tests failing because the deployed `.github/workflows/main.yml` still contains the old V2 per-run Telegram notification. Scanning was skipped because `Test code` failed.

## Install exactly this one file
1. Extract this ZIP on your computer.
2. Open your GitHub repository `dippmr/DIP_JOB_RADAR`.
3. Replace `.github/workflows/main.yml` with the file from this ZIP (same path and name); commit the change to the `main` branch.
4. Go to GitHub Actions, select **DIP JOB RADAR V3** (new name), then **Run workflow**; confirm **Test code** and **Scan / deliver** both succeed.
5. Inspect the **Smart Telegram monitor** step. A healthy scan before 9 PM IST should show `notifications=none`; a daily report should be sent on the first successful scan at or after 9 PM IST. Immediate verified job alerts remain separate.

## Safety
Do not edit cron-job.org. It remains a 15-minute workflow_dispatch trigger. Do not replace `jobs.sqlite3`, `private_state.enc`, or `RADAR_STATE_KEY` secrets. This patch replaces only the workflow YAML.

## Validation
Offline reconstruction (original project ZIP plus V3 patch, including this exact workflow): `140 passed, 73 subtests passed`.
Live GitHub/Telegram behavior is not yet verified.
