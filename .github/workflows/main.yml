
name: DIP JOB RADAR V2

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dip-job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DIP_JOB_RADAR_FREE/requirements.txt

      - name: Install dependencies
        working-directory: DIP_JOB_RADAR_FREE
        run: pip install -r requirements.txt pytest

      - name: Test code
        working-directory: DIP_JOB_RADAR_FREE
        run: python -m pytest -q

      - name: Scan / deliver
        working-directory: DIP_JOB_RADAR_FREE
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_STATE_KEY: ${{ secrets.RADAR_STATE_KEY }}
          DRY_RUN: '0'
          MIN_SCORE: '65'
          RSS_ENABLED: '1'
          RSS_QUERIES_PER_RUN: '12'
          MAX_RESULTS_PER_QUERY: '12'
          MAX_ALERTS_PER_RUN: '12'
          SEND_HEARTBEAT: '1'
          WEEKLY_REPORT: '1'
        run: python -m radar.v2

      - name: Create consistent state backup
        if: always()
        working-directory: DIP_JOB_RADAR_FREE
        run: python -m radar.backup

      - name: Upload short-lived backup artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-backup-${{ github.run_id }}
          path: DIP_JOB_RADAR_FREE/tmp/backup/
          if-no-files-found: warn
          retention-days: 7

      - name: Commit public history and encrypted private state
        run: |
          git config user.name "DIP JOB RADAR"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DIP_JOB_RADAR_FREE/data/jobs.sqlite3
          if test -f DIP_JOB_RADAR_FREE/data/private_state.enc; then
            git add DIP_JOB_RADAR_FREE/data/private_state.enc
          fi
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Radar: update scan history and encrypted state"
            git push origin HEAD:main
          fi
