name: DIP JOB RADAR FREE

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dip-job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DIP_JOB_RADAR_FREE/requirements.txt

      - name: Install dependencies
        working-directory: DIP_JOB_RADAR_FREE
        run: pip install -r requirements.txt

      - name: Run DIP JOB RADAR
        working-directory: DIP_JOB_RADAR_FREE
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SCORE: "60"
          MAX_RESULTS_PER_QUERY: "15"
          FRESH_WINDOW: "7d"
          DRY_RUN: "0"
        run: python -m radar

      - name: Commit duplicate database
        run: |
          git config user.name "DIP JOB RADAR"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DIP_JOB_RADAR_FREE/data/jobs.sqlite3
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Update job radar database"
            git push origin HEAD:main
          fi
