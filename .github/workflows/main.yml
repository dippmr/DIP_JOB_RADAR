name: DIP JOB RADAR V3

# cron-job.org triggers this workflow every 15 minutes via workflow_dispatch.
# The original GitHub cron was removed to avoid double scans.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dip-job-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: DIP_JOB_RADAR_FREE/requirements.txt

      - name: Install dependencies
        working-directory: DIP_JOB_RADAR_FREE
        run: pip install -r requirements.txt pytest

      - name: Test code
        working-directory: DIP_JOB_RADAR_FREE
        run: python -m pytest -q

      - name: Scan / deliver
        id: radar_scan
        working-directory: DIP_JOB_RADAR_FREE
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_STATE_KEY: ${{ secrets.RADAR_STATE_KEY }}
          DRY_RUN: '0'
          MIN_SCORE: '65'
          CAREER_PAGES_ENABLED: '1'
          RSS_ENABLED: '1'
          RSS_QUERIES_PER_RUN: '12'
          MAX_RESULTS_PER_QUERY: '12'
          MAX_ALERTS_PER_RUN: '12'
          SEND_HEARTBEAT: '0' # Ordinary scans are silent; smart monitor sends daily report
          SEND_FEED_ALERT: '0' # Source failures appear in the daily report
          WEEKLY_REPORT: '0' # Only the smart daily report is sent
        run: |
          set -o pipefail
          python -m radar.v2 | tee /tmp/dip_radar_scan.log

      - name: Create consistent state backup
        if: always()
        working-directory: DIP_JOB_RADAR_FREE
        run: python -m radar.backup

      - name: Upload short-lived backup artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: radar-backup-${{ github.run_id }}
          path: DIP_JOB_RADAR_FREE/tmp/backup/
          if-no-files-found: warn
          retention-days: 7

      # Runs after the scan and backup, even when an earlier step failed.
      # Successful 15-minute scans stay silent. A summary is sent once daily
      # on the first healthy run at/after 21:00 IST. A warning is sent when a
      # streak first reaches 3 consecutive failed workflow runs.
      - name: Smart Telegram monitor (daily summary / failure warning)
        id: smart_monitor
        if: ${{ always() }}
        working-directory: DIP_JOB_RADAR_FREE
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_WORKFLOW_STATUS: ${{ job.status }}
          RADAR_SCAN_STATUS: ${{ steps.radar_scan.outcome }}
        run: python -m radar.smart_notifications

      # Save monitoring state as well as job history so daily summaries and
      # failure warnings are not repeated every 15 minutes. Commit even after
      # a scan/test failure (when checkout worked) to retain failure streaks.
      - name: Commit scan history and monitor state
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          git config user.name "DIP JOB RADAR"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DIP_JOB_RADAR_FREE/data/jobs.sqlite3
          if test -f DIP_JOB_RADAR_FREE/data/private_state.enc; then
            git add DIP_JOB_RADAR_FREE/data/private_state.enc
          fi
          if test -f DIP_JOB_RADAR_FREE/data/monitor_state.json; then
            git add DIP_JOB_RADAR_FREE/data/monitor_state.json
          fi
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Radar: update scan history and monitoring state"
            git push origin HEAD:main
          fi
