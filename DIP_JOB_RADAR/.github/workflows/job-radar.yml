name: DIP JOB RADAR FREE

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: dip-job-radar-free
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run DIP JOB RADAR
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SCORE: "60"
          MAX_RESULTS_PER_QUERY: "15"
          DRY_RUN: "0"
        run: python -m radar

      - name: Commit duplicate database
        run: |
          git config user.name "DIP JOB RADAR"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.sqlite3
          if git diff --cached --quiet; then
            echo "No database changes."
          else
            git commit -m "Update job radar database"
            git push origin HEAD:main
          fi
